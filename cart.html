<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fruit Store | Cart</title>
    <link rel="stylesheet" href="./css/styles.css">
  </head>

  <body class="page">
    <header class="site-header">
      <h1>Fruit Store</h1>

      <nav class="site-nav">
        <a href="./index.html">Home</a>
        <a href="./products.html">Products</a>
        <a href="./cart.html">Cart</a>
      </nav>
    </header>

    <main class="cart-page">
      <section class="page-intro">
        <h2>Your shopping cart</h2>
        <p>Review the products you added and remove items if needed.</p>
      </section>

      <section class="cart-section">
        <h2>Items</h2>
        <div id="items" class="cart-list"></div>
      </section>

      <section class="cart-summary">
        <h2>Summary</h2>
        <p id="total">Total items: 0</p>
        <a class="button" href="./products.html">Continue shopping</a>
      </section>
    </main>

    <footer class="site-footer">
      <p>© 2026 Fruit Store</p>
    </footer>

    <script type="module" src="./js/cart-page.js"></script>
  </body>
</html>
